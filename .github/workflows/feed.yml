name: feed
on:
  schedule:
    # 8am-2am New York every 15 min on off-peak minutes, hourly overnight. Never :00.
    - cron: "7,22,37,52 8-23,0-1 * * *"
      timezone: "America/New_York"
    - cron: "7 2-7 * * *"
      timezone: "America/New_York"
  push:
    branches: [main]
    paths: [src/**, site/**, config/**, posts/**, .github/workflows/**]
  workflow_dispatch:
concurrency:
  group: feed
  cancel-in-progress: false
permissions:
  actions: read
  contents: write
  pages: write
  id-token: write
  issues: write
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy_retry.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - if: github.event_name == 'push'
        run: npm test
      - id: fetch
        run: node src/run.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARENA_TOKEN: ${{ secrets.ARENA_TOKEN }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
      - name: Commit new items / state
        if: steps.fetch.outputs.dirty == 'true'
        env:
          SUMMARY: ${{ steps.fetch.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "$SUMMARY"
          # Retry: a manual push to main during the run would reject this push.
          for n in 1 2 3; do git pull --rebase && git push && exit 0; sleep $((n * 5)); done; exit 1
      # Scheduled workflows are disabled after 60 days without repo activity: commit if the last one is 50+ days old.
      - name: Keepalive
        if: steps.fetch.outputs.dirty != 'true'
        run: |
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive"
            for n in 1 2 3; do git pull --rebase && git push && exit 0; sleep $((n * 5)); done; exit 1
          fi
      # Pushes and manual runs always deploy. A scheduled run deploys only if something changed, or if the previous run failed
      # (e.g. a hung Pages deploy left the site behind the data); otherwise it stops here: no build, no deploy.
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          COUNT: ${{ steps.fetch.outputs.count }}
        run: |
          last=$(gh run list --workflow feed.yml --status completed --limit 1 --json conclusion --jq '.[0].conclusion')
          if [ "$EVENT" != schedule ] || [ "$COUNT" != 0 ] || [ "$last" != success ]; then echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.gate.outputs.go == 'true'
        run: npm run build
      - if: steps.gate.outputs.go == 'true'
        uses: actions/upload-pages-artifact@v3
      - id: deploy
        if: steps.gate.outputs.go == 'true'
        uses: actions/deploy-pages@v4
        continue-on-error: true # a hung Pages deployment fails here; retry once below
        with:
          timeout: 240000 # 4 min instead of the 10 min default
      - name: Cancel stuck Pages deployments
        if: steps.deploy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=3" --jq '.[].sha'); do
            gh api -X POST "repos/$GITHUB_REPOSITORY/pages/deployments/$sha/cancel" || true
          done
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
